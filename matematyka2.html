<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kalkulator liczb zespolonych</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Kalkulator liczb zespolonych</h1>
</header>

<main>
    <div class="dzial">
        <h2>Menu</h2>
        <ul>
            <li><a href="StronaGlowna.html">Strona główna</a></li>
        </ul>
    </div>
    <div class="dzial">
        <h2>Wprowadź liczby</h2>

        <p>Liczba 1: </p>
        <input type="number" id="a1" placeholder="Re">
        <input type="number" id="b1" placeholder="Im">

        <p>Liczba 2: </p>
        <input type="number" id="a2" placeholder="Re">
        <input type="number" id="b2" placeholder="Im">

        <br><br>

        <button onclick="dodaj()">Dodawanie</button>
        <button onclick="odejmij()">Odejmowanie</button>
        <button onclick="mnoz()">Mnożenie</button>
        <button onclick="dziel()">Dzielenie</button>

        <h3>Wynik:</h3>
        <p id="wynik"></p>
    </div>
</main>

<footer>
    <p>© Kalkulator zespolony</p>
</footer>

<script>
function pobierz() {
    let a1 = parseFloat(document.getElementById("a1").value) || 0;
    let b1 = parseFloat(document.getElementById("b1").value) || 0;
    let a2 = parseFloat(document.getElementById("a2").value) || 0;
    let b2 = parseFloat(document.getElementById("b2").value) || 0;
    return {a1, b1, a2, b2};
}

function pokaz(a, b) {
    document.getElementById("wynik").innerText = `${a} + ${b}i`;
}

function dodaj() {
    let {a1, b1, a2, b2} = pobierz();
    pokaz(a1 + a2, b1 + b2);
}

function odejmij() {
    let {a1, b1, a2, b2} = pobierz();
    pokaz(a1 - a2, b1 - b2);
}

function mnoz() {
    let {a1, b1, a2, b2} = pobierz();
    let re = a1*a2 - b1*b2;
    let im = a1*b2 + b1*a2;
    pokaz(re, im);
}

function dziel() {
    let {a1, b1, a2, b2} = pobierz();
    let mianownik = a2*a2 + b2*b2;

    if(mianownik === 0) {
        document.getElementById("wynik").innerText = "Nie można dzielić przez 0";
        return;
    }

    let re = (a1*a2 + b1*b2) / mianownik;
    let im = (b1*a2 - a1*b2) / mianownik;
    pokaz(re, im);
}
</script>
</html>
